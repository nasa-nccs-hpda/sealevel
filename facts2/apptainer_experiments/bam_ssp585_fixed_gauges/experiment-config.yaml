experiment_name:
        "apptainer_experiments/bam_ssp585_fixed_gauges"

projection_scale:
        local

##----- Top-level params -----##
pipeline-id:
        # Pipeline ID
        bam001
nsamps:
        # Number of samples
        500
scenario:
        # Emissions scenario name
        ssp585
pyear_start:
        # Enter pyear_start
        2020
pyear_end:
        # Enter pyear_end
        2150
pyear_step:
        # Enter pyear_step
        10
baseyear:
        # Enter baseyear
        2005
location-file:
        # File containing name, id, lat, and lon of points for localization
        psmsl_gauges.lst

##----- Modules included in experiment -----##
climate_module:
        fair-temperature
sealevel_modules:
        - bamber19-icesheets
framework_modules:
        - facts-total

##----- Workflows (facts-total) -----##
workflows:
  all-modules: "bamber19-icesheets"

##----- Inputs -----##
module-specific-input-data:
        # Module-specific input data
        "/panfs/ccds02/nobackup/projects/ilab/projects/sealevel/facts2/data/module_specific_input_data"
shared-input-data:
        # Shared input data
        "/panfs/ccds02/nobackup/projects/ilab/projects/sealevel/facts2/data/shared_input_data"
experiment-specific-input-data:
        # Experiment-specific input data (eg. alternative FAIR data)
        []

##----- Outputs -----##
output-data-location:
        # Output path
        "/panfs/ccds02/nobackup/projects/ilab/projects/sealevel/facts2/apptainer_experiments/bam_ssp585_fixed_gauges/output"


