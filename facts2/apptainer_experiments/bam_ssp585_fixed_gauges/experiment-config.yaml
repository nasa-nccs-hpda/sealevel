##----- Module schemas -----##
module_registry_version: #Version of module registry used to generate this experiment configuration file.
        local@a085795

module_schemas:
  fair-temperature:
    module_name: fair-temperature
    container_image: "ghcr.io/fact-sealevel/fair-temperature:0.2.1"
    arguments:
      top_level:
        - {'name': 'pipeline-id', 'type': 'str', 'source': 'metadata.pipeline-id', 'help': 'Pipeline ID'}
        - {'name': 'nsamps', 'type': 'int', 'source': 'metadata.nsamps', 'help': 'Number of samples'}
        - {'name': 'scenario', 'type': 'str', 'source': 'metadata.scenario', 'help': 'Emissions scenario name', 'transform': 'scenario_name'}
      options:
        - {'name': 'cyear-start', 'type': 'int', 'source': 'module_inputs.inputs.cyear_start', 'help': 'TO DO ADD HELP TEXT', 'default_value': 1850}
        - {'name': 'cyear-end', 'type': 'int', 'source': 'module_inputs.inputs.cyear_end', 'help': 'TO DO ADD HELP TEXT', 'default_value': 1900}
        - {'name': 'smooth-win', 'type': 'int', 'source': 'module_inputs.inputs.smooth_win', 'help': 'TO DO ADD HELP TEXT', 'default_value': 19}
        - {'name': 'seed', 'type': 'int', 'source': 'module_inputs.options.seed', 'help': 'Seed for the random number generator.', 'optional': False, 'default_value': 2314}
      inputs:
        - {'name': 'rcmip-file', 'type': 'file', 'source': 'module_inputs.inputs.rcmip_fname', 'help': 'TO DO ADD HELP TEXT', 'mount': {'container_path': '/mnt/module_specific_in', 'volume': 'module_specific_in'}, 'filename': 'rcmip/rcmip-emissions-annual-means-v5-1-0.csv'}
        - {'name': 'param-file', 'type': 'file', 'source': 'module_inputs.inputs.param_fname', 'help': 'TO DO ADD HELP TEXT', 'mount': {'container_path': '/mnt/module_specific_in', 'volume': 'module_specific_in'}, 'filename': 'parameters/fair_ar6_climate_params_v4.0.nc'}
      outputs:
        files:
          - {'name': 'output-oceantemp-file', 'type': 'file', 'source': 'module_inputs.outputs.output_0', 'help': 'TO DO ADD HELP TEXT', 'mount': {'container_path': '/mnt/out', 'volume': 'output', 'transform': 'filename'}, 'filename': 'oceantemp.nc', 'output_type': 'global'}
          - {'name': 'output-climate-file', 'type': 'file', 'source': 'module_inputs.outputs.output_1', 'help': 'TO DO ADD HELP TEXT', 'mount': {'container_path': '/mnt/out', 'volume': 'output', 'transform': 'filename'}, 'filename': 'climate.nc', 'output_type': 'global'}
          - {'name': 'output-ohc-file', 'type': 'file', 'source': 'module_inputs.outputs.output_2', 'help': 'TO DO ADD HELP TEXT', 'mount': {'container_path': '/mnt/out', 'volume': 'output', 'transform': 'filename'}, 'filename': 'ohc.nc', 'output_type': 'global'}
          - {'name': 'output-gsat-file', 'type': 'file', 'source': 'module_inputs.outputs.output_3', 'help': 'TO DO ADD HELP TEXT', 'mount': {'container_path': '/mnt/out', 'volume': 'output', 'transform': 'filename'}, 'filename': 'gsat.nc', 'output_type': 'global'}
    volumes:
      module_specific_in:
        host_path: module_inputs.input_paths.module_specific_input_dir
        help: "TO DO ADD HELP TEXT"
        container_path: "/mnt/module_specific_in"
      shared_in:
        host_path: module_inputs.input_paths.shared_input_dir
        help: "TO DO ADD HELP TEXT"
        container_path: "/mnt/shared_in"
      output:
        host_path: module_inputs.output_paths.output_dir
        help: "TO DO ADD HELP TEXT"
        container_path: "/mnt/out"
    command: main
    uses_climate_file: False
    per_workflow: False
    output_types:
      - global
      - local
  bamber19-icesheets:
    module_name: bamber19-icesheets
    container_image: "ghcr.io/fact-sealevel/bamber19-icesheets:0.2.0"
    arguments:
      top_level:
        - {'name': 'pipeline-id', 'type': 'str', 'source': 'metadata.pipeline-id'}
        - {'name': 'nsamps', 'type': 'int', 'source': 'metadata.nsamps'}
        - {'name': 'scenario', 'type': 'str', 'source': 'metadata.scenario', 'transform': 'scenario_name'}
        - {'name': 'pyear-start', 'type': 'int', 'source': 'metadata.pyear_start'}
        - {'name': 'pyear-end', 'type': 'int', 'source': 'metadata.pyear_end'}
        - {'name': 'pyear-step', 'type': 'int', 'source': 'metadata.pyear_step'}
        - {'name': 'baseyear', 'type': 'int', 'source': 'metadata.baseyear'}
        - {'name': 'location-file', 'type': 'str', 'source': 'metadata.location-file', 'help': 'File containing name, id, lat, and lon of points for localization', 'optional': True, 'mount': {'container_path': '/mnt/shared_in', 'volume': 'input'}, 'transform': 'filename'}
      options:
        - {'name': 'replace', 'type': 'int', 'source': 'module_inputs.options.replace', 'default_value': 1}
        - {'name': 'chunksize', 'type': 'int', 'source': 'module_inputs.options.chunksize', 'optional': True, 'default_value': 50}
        - {'name': 'rngseed', 'type': 'int', 'source': 'module_inputs.options.seed', 'help': 'Seed for the random number generator.', 'optional': False, 'default_value': 1423}
      inputs:
        - {'name': 'climate-data-file', 'type': 'file', 'source': 'module_inputs.inputs.climate_data_file', 'mount': {'container_path': '/mnt/out', 'volume': 'output', 'transform': 'filename'}, 'external_volume': True, 'climate_step_output': 'output-climate-file'}
        - {'name': 'slr-proj-mat-file', 'type': 'file', 'source': 'module_inputs.inputs.slr_proj_mat_file', 'mount': {'container_path': '/mnt/module_specific_in', 'volume': 'module_specific_input'}, 'filename': 'SLRProjections190726core_SEJ_full.mat'}
      outputs:
        files:
          - {'name': 'output-AIS-gslr-file', 'type': 'file', 'source': 'module_inputs.outputs.output-AIS-gslr-file', 'mount': {'container_path': '/mnt/out', 'volume': 'output', 'transform': 'filename'}, 'filename': 'AIS-gslr.nc', 'output_type': 'global'}
          - {'name': 'output-EAIS-gslr-file', 'type': 'file', 'source': 'module_inputs.outputs.output-EAIS-gslr-file', 'mount': {'container_path': '/mnt/out', 'volume': 'output', 'transform': 'filename'}, 'filename': 'EAIS-gslr.nc', 'output_type': 'global', 'pass_to_total': False}
          - {'name': 'output-WAIS-gslr-file', 'type': 'file', 'source': 'module_inputs.outputs.output-WAIS-gslr-file', 'mount': {'container_path': '/mnt/out', 'volume': 'output', 'transform': 'filename'}, 'filename': 'WAIS-gslr.nc', 'output_type': 'global', 'pass_to_total': False}
          - {'name': 'output-GIS-gslr-file', 'type': 'file', 'source': 'module_inputs.outputs.output-GIS-gslr-file', 'mount': {'container_path': '/mnt/out', 'volume': 'output', 'transform': 'filename'}, 'filename': 'GIS-gslr.nc', 'output_type': 'global'}
          - {'name': 'output-AIS-lslr-file', 'type': 'file', 'source': 'module_inputs.outputs.output-AIS-lslr-file', 'mount': {'container_path': '/mnt/out', 'volume': 'output', 'transform': 'filename'}, 'filename': 'AIS-lslr.nc', 'output_type': 'local'}
          - {'name': 'output-EAIS-lslr-file', 'type': 'file', 'source': 'module_inputs.outputs.output-EAIS-lslr-file', 'mount': {'container_path': '/mnt/out', 'volume': 'output', 'transform': 'filename'}, 'filename': 'EAIS-lslr.nc', 'output_type': 'local', 'pass_to_total': False}
          - {'name': 'output-WAIS-lslr-file', 'type': 'file', 'source': 'module_inputs.outputs.output-WAIS-lslr-file', 'mount': {'container_path': '/mnt/out', 'volume': 'output', 'transform': 'filename'}, 'filename': 'WAIS-lslr.nc', 'output_type': 'local', 'pass_to_total': False}
          - {'name': 'output-GIS-lslr-file', 'type': 'file', 'source': 'module_inputs.outputs.output-GIS-lslr-file', 'mount': {'container_path': '/mnt/out', 'volume': 'output', 'transform': 'filename'}, 'filename': 'GIS-lslr.nc', 'output_type': 'local'}
      fingerprint_params:
        - {'name': 'fingerprint-dir', 'type': 'str', 'source': 'module_inputs.fingerprint_params.fingerprint_dir', 'help': 'TO DO ADD HELP TEXT', 'mount': {'container_path': '/mnt/shared_in', 'volume': 'input'}, 'default_value': 'FPRINT'}
    volumes:
      module_specific_input:
        host_path: module_inputs.input_paths.module_specific_input_dir
        container_path: "/mnt/module_specific_in"
      shared_input:
        host_path: module_inputs.input_paths.shared_input_dir
        container_path: "/mnt/shared_in"
      output:
        host_path: module_inputs.output_paths.output_dir
        container_path: "/mnt/out"
    command: main
    uses_climate_file: True
    per_workflow: False
    output_types:
      - global
      - local
  facts-total:
    module_name: facts-total
    container_image: "ghcr.io/fact-sealevel/facts-total:0.2.1"
    arguments:
      top_level:
        - {'name': 'pyear-start', 'type': 'int', 'source': 'metadata.pyear_start'}
        - {'name': 'pyear-end', 'type': 'int', 'source': 'metadata.pyear_end'}
        - {'name': 'pyear-step', 'type': 'int', 'source': 'metadata.pyear_step'}
      options:
        - {'name': 'name', 'type': 'str', 'source': 'module_inputs.options.name', 'optional': True}
      inputs:
        - {'name': 'item', 'type': 'file', 'source': 'module_inputs.inputs.item', 'mount': {'container_path': '/mnt/total_in', 'volume': 'input'}, 'multiple': True}
      outputs:
        files:
          - {'name': 'output-path', 'type': 'file', 'source': 'module_inputs.outputs.output_path', 'mount': {'container_path': '/mnt/total_out', 'volume': 'output', 'transform': 'filename'}, 'filename': 'total.nc', 'output_type': 'total'}
      fingerprint_params:
        - {'name': 'fingerprint-dir', 'type': 'str', 'source': 'module_inputs.fingerprint_params.fingerprint_dir', 'help': 'TO DO ADD HELP TEXT', 'mount': {'container_path': '/mnt/shared_in', 'volume': 'input'}}
    volumes:
      shared_input:
        host_path: module_inputs.input_paths.shared_input_dir
        container_path: "/mnt/shared_in"
      output:
        host_path: module_inputs.output_paths.output_dir
        container_path: "/mnt/total_out"
    command: 
    uses_climate_file: False
    per_workflow: True
    output_types:
      - global
      - local
    skip_fingerprint_params: True
